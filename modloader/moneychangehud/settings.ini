[GENERAL]
Visible            = 1   ; 0 = disables the mod (nothing will be shown)
DrawOnlyWhenHUDOn  = 0   ; 0 = disable. Render only when the HUD is visible

[HUD]
x         = 96.85   ; 0–100, percentage of the internal screen width (moves right as it increases)
y         = 20.0    ; 0–100, percentage of the internal screen height (moves down as it increases)
scaleX    = 0.7     ; Based on Widescreen Fix by ThirteenAG (HudXScale)
scaleY    = 0.7     ; Based on Widescreen Fix by ThirteenAG (HudYScale)
time      = 4       ; Seconds the money change indicator stays on screen (4 is recommended)
test      = 0       ; When set to 1, press F6 to add/subtract $1 (testing only)
moneySign = 1      ; 0 = disable, 1 = dollar sign (euro not compatible)
AccumulateMoneyChanges = 1 ; 0 = disable. Accumulate changes while animation is playing (pop-up)

ColorAdd =  ; Hex (0x, no #) or decimal. Empty = default classic colors
ColorSub =          ; Hex (0x, no #) or decimal

Rainbow  = 0        ; 0 = disabled, 1 = enable rainbow color animation

PadRumble = 1

