[window]
mode=2			; 1: window, 2: window borderless, 3: fullscreen
maximized=0
positionX=-1	; -1: centered
positionY=-1	; -1: centered
resolutionX=-1
resolutionY=-1
[game]
menuFPS=0		; frame rate limit for main menu. 0: unlimited
autoPause=1		; pause the game on window deactivation
autoResume=1	; resume the game on window activation