[window]
mode=3			; 1: window, 2: window borderless, 3: fullscreen
maximized=1
positionX=-1	; -1: centered
positionY=-1	; -1: centered
resolutionX=640
resolutionY=448
[game]
menuFPS=45		; frame rate limit for main menu. 0: unlimited
autoPause=1  	; pause the game on window deactivation
autoResume=0	; resume the game on window activation