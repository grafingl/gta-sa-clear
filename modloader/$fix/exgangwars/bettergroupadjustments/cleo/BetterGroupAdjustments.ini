; ==================================================
; Better Group Adjustments - Config
;
; IMPORTANT:
; - Changes to this file are applied on game start
; - Some features may require reloading the save
;
; Notes:
; - For more information about game button IDs: https://gtamods.com/wiki/00E1
; ==================================================

[Settings]

; --- MAIN ---
; Enable or disable the entire mod
; 0 = OFF / 1 = ON (Default: 1)
ENABLE_MOD = 1


; --- MEMBER CONTROL ---

; Choose how member interaction works for:
; - Give weapon (BTN_GIVE_WEAPON)
; - Remove member from group (BTN_REMOVE_MEMBER)
;
; 0 = AIM   -> Use aim on the selected member
;              Note: On gamepad, recruited members cannot be targeted,
;              so this mode is limited or unusable
; 1 = BTN   -> Context action on the nearest group member in front of the player
; 2 = BOTH  -> AIM or BTN
; Default: 2
CONTROL_MODE = 2

; Context button used for BTN mode
; Default: 4 (TAB / LEFTSHOULDER1)
; Note: may conflict with other mods (e.g. 2 Player Deluxe)
; Suggested alternative: 16 (Sprint / CROSS)
BTN_SELECT_MEMBER = 16

; Custom buttons used after selecting a group member.
; Note: helpbox text is static in CLEO, so it cannot display the custom button names dynamically.
; Use GTA button IDs from the list above.

; Default: 11 (DPADRIGHT / Conversation - Yes)
BTN_GIVE_WEAPON = 11

; Default: 10 (DPADLEFT / Conversation - No)
BTN_REMOVE_MEMBER = 10

; Maximum distance to give a weapon in AIM mode
; Range: 1.0 - 50.0 (Default: 5.0)
WEAPON_GIVE_RADIUS = 5.0

; Weapon transfer behavior when giving a weapon to a member.
; 0 = COPY     -> Member receives a copy of the player's current weapon.
; 1 = TRANSFER -> Member receives the weapon and the player loses it.
; Default: 0
WEAPON_GIVE_MODE = 0


; --- FEATURES ---

; Allow recruited gang members to enter interiors with the player
; 0 = OFF / 1 = ON (Default: 1)
ENABLE_ENTER_GANG_INTERIOR = 1


[Auto Attack]

; Enable automatic combat for group members
;
; Manual use:
; - Aim at a target and press TAB (LEFTSHOULDER1 / recruit key)
; - Group members will attack that target
; - Then they will continue attacking enemies of the same type
;
; Gang wars:
; - Activates automatically against the enemy gang
; 0 = OFF / 1 = ON (Default: 1)
ENABLE_AUTO_ATTACK = 1

; Show red blips on targets assigned to group members
; 0 = OFF / 1 = ON (Default: 1)
USE_TARGET_BLIPS = 1

; Time between target searches / updates (milliseconds)
; 1000 ms = 1 second
; Range: 250 - 10000 (Default: 1000)
AUTO_ATTACK_UPDATE_MS = 1000

; Time before targets are fully cleared and reassigned (milliseconds)
; Helps members switch targets if their current target escapes
; or if another member fails to finish off its target
; 1000 ms = 1 second
; Range: 2000 - 60000 (Default: 5000)
AUTO_ATTACK_RETARGET_MS = 5000


[Find Target]

; --- GENERAL ---
; Default enemy detection radius (meters)
; Used when per-slot search is disabled
; or when a slot value is missing / invalid
; Default: 48.0
RADIUS_DEFAULT = 48.0

; --- PER WEAPON SLOT RADIUS ---
; Use different detection radius values depending on the weapon slot
; currently used by the member
;
; When enabled, slot radius values override RADIUS_DEFAULT
; 0 = OFF / 1 = ON (Default: 0)
ENABLE_SEARCH_PER_WEAPON_SLOT = 1

; Detection radius by weapon slot
; Note:
; - If a slot value is missing or lower than 1.0, RADIUS_DEFAULT is used

RADIUS_SLOT_MELEE   = 32.0
RADIUS_SLOT_PISTOL  = 40.0
RADIUS_SLOT_SHOTGUN = 48.0
RADIUS_SLOT_SMG     = 64.0
RADIUS_SLOT_ASSAULT = 96.0
RADIUS_SLOT_SNIPER  = 128.0
RADIUS_SLOT_HEAVY   = 80.0
RADIUS_SLOT_THROWN  = 72.0