[Controls]
; Windows virtual-key code. 82 is the R key.
ReloadKey=82

[Settings]
; Block weapons without reload animations: flamethrower, minigun,
; fire extinguisher, spray can, and camera.
DisableWeaponsWithoutAnim=1

; Do not reload when the current magazine is already full.
DontReloadIfFull=1

; Discard the ammunition left in the magazine before reloading.
RealisticReload=1

; Enable compatibility with KeepNoAmmo.SA.asi.
; This forces DisableScrollReload on so switching weapons cannot refill an empty magazine.
KeepNoAmmo=0

; Prevent weapon switching/scrolling from refilling the magazine.
; This is forced on when RealisticReload or KeepNoAmmo is enabled.
DisableScrollReload=1

; Prevent the game from automatically refilling the magazine in a vehicle.
; This is forced on when RealisticReload is enabled.
DisableVehicleAutoReload=0
